build-tonushree-apk.yml


name: Build Tonushree Mobile APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Tonushree project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf project
          mkdir -p project
          unzip -q -o "Tonushree_Safe_Mobile_v3.zip" -d project
          test -f project/settings.gradle
          test -f project/app/build.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable APK
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon assembleDebug
          test -f app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk Tonushree_Jewellers.apk
          sha256sum Tonushree_Jewellers.apk > Tonushree_Jewellers.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tonushree-Jewellers-Mobile
          path: |
            project/Tonushree_Jewellers.apk
            project/Tonushree_Jewellers.apk.sha256
          if-no-files-found: error
          retention-days: 30
